<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Meladine instrument render harness</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const q = new URLSearchParams(location.search);
const preset = q.get("preset");
const width = Number(q.get("w") || 1400);
const height = Number(q.get("h") || 1400);

const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(width, height);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
document.body.appendChild(renderer.domElement);

function shadowTexture(stops) {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 256;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

let camera;
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder); // public/models are meshopt-compressed

function finish() {
  // Render a few frames so textures settle, then expose the PNG.
  let n = 0;
  const tick = () => {
    renderer.render(scene, camera);
    if (++n < 4) return requestAnimationFrame(tick);
    window.__png = renderer.domElement.toDataURL("image/png");
    window.__done = true;
  };
  tick();
}

if (preset === "hero") {
  // Mirrors components/home/GuitarModel.tsx
  camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
  const yOffset = 0.04;
  camera.position.set(0, yOffset, 4.75);
  camera.lookAt(0, yOffset, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 1.9));
  const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(3, 4, 5); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 1.3); fill.position.set(-4, 2, 4); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xed1438, 0.9); rim.position.set(0, -2, -3); scene.add(rim);

  const targetHeight = 2.65;
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1.25, 1.25),
    new THREE.MeshBasicMaterial({ map: shadowTexture([[0,"rgba(0,0,0,0.20)"],[0.25,"rgba(0,0,0,0.05)"],[0.6,"rgba(0,0,0,0)"],[1,"rgba(0,0,0,0)"]]), transparent: true, opacity: 0.45, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -targetHeight / 2 + yOffset - 0.02;
  scene.add(shadow);

  loader.load("/public/models/electric_guitar.glb", (gltf) => {
    const root = gltf.scene;
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const scale = targetHeight / size.y;
    root.scale.setScalar(scale);
    root.position.set(-center.x * scale, -center.y * scale + yOffset, -center.z * scale);
    scene.add(root);
    finish();
  }, undefined, (e) => { window.__error = String(e); window.__done = true; });
} else {
  // Mirrors the "center" slot of components/home/Disciplines3D.tsx
  const configs = {
    guitar: { path: "/public/models/guitar.glb", targetSize: 2.35, preRot: [Math.PI / 2, 0, 0], centerRot: [0, 0, -(50 * Math.PI) / 180], centerOffset: [0, 0.02, 0] },
    piano:  { path: "/public/models/electronic_piano_keyboard.glb", targetSize: 2.45, preRot: [0, 0, 0], centerRot: [0.45, 0, 0], centerOffset: [0, -0.05, 0] },
    vocals: { path: "/public/models/fredsters_microphone.glb", targetSize: 2.05, preRot: [0, 0, 0], centerRot: [-0.22, 0.4, 0.3], centerOffset: [0, 0.04, 0] },
  };
  const cfg = configs[preset];

  camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 100);
  camera.position.set(0, 0, 4.6);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 2.1));
  const key = new THREE.DirectionalLight(0xffffff, 2.7); key.position.set(4, 5, 5); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 1.5); fill.position.set(-5, 2, 4); scene.add(fill);
  const bounce = new THREE.DirectionalLight(0xffffff, 1.0); bounce.position.set(0, -3, 3); scene.add(bounce);
  const rim = new THREE.DirectionalLight(0xed1438, 0.85); rim.position.set(0, 1, -4); scene.add(rim);
  const spot = new THREE.SpotLight(0xffffff, 3.4, 14, Math.PI / 3.8, 0.45, 1);
  spot.position.set(0, 4.8, 3.8); spot.target.position.set(0, 0, 0); scene.add(spot); scene.add(spot.target);

  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1.2, 1.2),
    new THREE.MeshBasicMaterial({ map: shadowTexture([[0,"rgba(0,0,0,0.22)"],[0.2,"rgba(0,0,0,0.07)"],[0.45,"rgba(0,0,0,0)"],[1,"rgba(0,0,0,0)"]]), transparent: true, opacity: 0.45, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(0, -1.18, 0.05);
  scene.add(shadow);

  loader.load(cfg.path, (gltf) => {
    const root = gltf.scene;
    root.rotation.set(...cfg.preRot);
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    root.scale.setScalar(cfg.targetSize / (maxDim || 1));
    root.updateMatrixWorld(true);
    const scaledCenter = new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3());
    const inner = new THREE.Group();
    inner.add(root);
    root.position.set(-scaledCenter.x + cfg.centerOffset[0], -scaledCenter.y + cfg.centerOffset[1], -scaledCenter.z + cfg.centerOffset[2]);
    const group = new THREE.Group();
    group.add(inner);
    group.position.set(0, 0.05, 0.28);
    group.scale.setScalar(1.22);
    group.rotation.set(...cfg.centerRot);
    scene.add(group);
    finish();
  }, undefined, (e) => { window.__error = String(e); window.__done = true; });
}
</script>
</body>
</html>
